services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - app/backend/.env
    environment:
      DB_HOST: postgres
    volumes:
      - ./app/backend:/workspace/app/backend
      - ./app/frontend:/workspace/app/frontend
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: hakka
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
